<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>E-shop – Košík</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="logo">Nábytek.cz</div>
  <nav>
    <a href="index.html">Produkty</a>
    <a href="purchase.html" class="active">Košík</a>
  </nav>
</header>

<main class="container">
  <h1>Košík</h1>

  <div id="cartItems" class="cart-list"></div>

  <section class="form">
    <h2>Doručovací údaje</h2>
    <input id="firstName" placeholder="Jméno">
    <input id="lastName" placeholder="Příjmení">
    <input id="email" placeholder="Email">
    <input id="userAddress" placeholder="Ulice, město, PSČ">
  </section>

  <div class="order-buttons">
    <button onclick="sendOrder()">Odeslat objednávku</button>
    <button class="secondary" onclick="newOrder()">Nová objednávka</button>
  </div>

  <div id="result" class="status"></div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
<script src="app.js"></script>
</body>
</html>
