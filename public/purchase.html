<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>E-shop – Košík</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div>E-shop – Nábytek</div>
  <div>
    <a href="index.html"><button>Produkty</button></a>
    <button>Košík</button>
  </div>
</header>

<div class="container">
  <h2>Košík</h2>

  <div id="cartItems"></div>

  <h3>Doručovací údaje</h3>
  <input id="firstName" placeholder="Jméno">
  <input id="lastName" placeholder="Příjmení">
  <input id="email" placeholder="Email">
  <input id="userAddress" placeholder="Ulice, město, PSČ">

  <div class="order-buttons">
    <button onclick="sendOrder()">Odeslat objednávku</button>
    <button class="secondary" onclick="newOrder()">Nová objednávka</button>
  </div>

  <div class="status" id="result"></div>
</div>

<script src="script.js"></script>
<script src="app.js"></script>
</body>
</html>
