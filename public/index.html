<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>E-shop – Nábytek</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="logo">Nábytek.cz</div>
  <nav>
    <a href="index.html" class="active">Produkty</a>
    <a href="purchase.html">
      Košík <span id="cartCount" class="badge">0</span>
    </a>
  </nav>
</header>

<main class="container">
  <h1>Naše produkty</h1>

  <div class="product-grid">

    <div class="product-card">
      <img src="img/zidle.jpg" alt="Židle">
      <h3>Židle</h3>
      <p>Kvalitní dřevěná židle</p>
      <button onclick="addToCart('Židle')">Přidat do košíku</button>
    </div>

    <div class="product-card">
      <img src="img/sedacka.jpg" alt="Sedačka">
      <h3>Sedačka</h3>
      <p>Pohodlná sedačka</p>
      <button onclick="addToCart('Sedačka')">Přidat do košíku</button>
    </div>

    <div class="product-card">
      <img src="img/postel.jpg" alt="Postel">
      <h3>Postel</h3>
      <p>Manželská postel</p>
      <button onclick="addToCart('Postel')">Přidat do košíku</button>
    </div>

    <div class="product-card">
      <img src="img/skrin.jpg" alt="Skříň">
      <h3>Skříň</h3>
      <p>Prostorná skříň</p>
      <button onclick="addToCart('Skříň')">Přidat do košíku</button>
    </div>

  </div>
</main>

<script src="script.js"></script>
</body>
</html>
